apiVersion: 1

datasources:
  - name: Postgres
    uid: copilot-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: copilot
    jsonData:
      database: copilot_usage
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: copilot
    isDefault: true

  - name: Prometheus
    uid: copilot-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      httpMethod: POST

  - name: Tempo
    uid: copilot-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
