global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Live Copilot CLI OTel metrics, exposed by the collector's prometheus exporter.
  - job_name: copilot-otel
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
